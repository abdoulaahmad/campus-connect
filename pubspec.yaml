name: campus_connect
description: CampusConnect AUS - Unified Intelligent Mobile Campus Platform
publish_to: 'none'

# CAM-AUS-11 | Group 11 | FCP/CIT/22/1000
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management & DI ─────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Typography ────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  meta: ^1.18.0

  # ── Firebase (kept for build compatibility — not used in prod anymore) ─────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4

  # ── Supabase (Production backend) ────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── Biometric Auth (Sprint 2) ─────────────────────────────────────────────
  local_auth: ^2.2.0

  # ── Secure Storage (Sprint 2) ─────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── HTTP Client — DEV/Mockoon only (Sprint 2) ─────────────────────────────
  dio: ^5.4.3

  # ── UUID generation ───────────────────────────────────────────────────────────
  uuid: ^4.4.0

  # ── Offline Storage & Sync (Sprint 4) ─────────────────────────────────────
  sqflite: ^2.4.3
  path: ^1.9.1

  # ── Marketplace & QR (Sprint 5) ───────────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # ── Campus Map & Geolocation (Sprint 6) ───────────────────────────────────
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config/config.json
